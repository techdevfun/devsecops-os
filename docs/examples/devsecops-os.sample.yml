# STATIC SAMPLE (M1) — the system's configuration file as installed at milestones M2/M3.
# A single configuration file in the adopting organisation's repo: policy
# pack selection, per-gate modes, evidence store location. Defaults follow
# the blueprint principle: report-only on first install; blocking only after
# calibration on that repo's own history (backtest -> report-only -> enforce).

version: 1

organization:
  name: example-bank            # organisation name (recorded into evidence reports only)
  config_repo: null             # central configuration repo (phase 3); leave empty in phase 1

# Policy packs are installed at M2. Mappings are REFERENCE mappings, not a compliance certification.
policy_packs:
  - iso-27001-2022
  - nist-csf-ssdf
  - pci-dss-4
  # - apra-cps-234
  # - apra-cps-230
  # - soc-2

gates:
  secret-scanning:
    mode: block                 # the only gate that blocks immediately by default (low noise)
  sast:
    mode: report-only
  sca:
    mode: report-only
  iac:
    mode: report-only
  container:
    mode: report-only
  sbom-attestation:
    mode: report-only           # missing SBOM/attestation: warning in phase 1
  license:
    mode: report-only
  kev-epss:
    mode: report-only
    kev_block: true             # a CVE in CISA KEV: first blocking candidate once calibration is done
    epss_threshold: 0.5
  pipeline-hygiene:
    mode: block                 # third-party action not pinned to a full SHA -> block
  ai-pr-review:                 # flagship #1 — OFF BY DEFAULT in phase 1
    enabled: false              # enabled only once flagship #1 passes its own release gate
    mode: report-only

evidence:
  store: "./.devsecops-os/evidence"   # in the organisation's infrastructure; may point to S3/object storage
  retention_days: 400
  bundle_manifest: sha256

notifications:
  # Uses GitHub's built-in mechanisms (check runs, PR comments). A webhook is
  # the organisation's option; the credential is managed by the organisation in its own secrets.
  webhook_url_secret: null      # name of the secret holding the Slack/Teams/Telegram webhook; empty = off
