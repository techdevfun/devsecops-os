# STATIC SAMPLE (M1) — not verified on a real cluster.
# Kyverno ClusterPolicy: only accepts images signed keyless with the OIDC
# identity of an organisation workflow AND carrying a SLSA provenance
# attestation. A nonconforming image is rejected at admission; the rejection
# decision is itself evidence (see docs/architecture.md, section 4).
# Before use you MUST replace: <OWNER>/<REPO>, the registry and image name patterns.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: devsecops-os-verify-image-provenance
  annotations:
    policies.kyverno.io/title: "devsecops-os: verify signed images with provenance"
    policies.kyverno.io/category: "Supply Chain Security"
    policies.kyverno.io/description: >-
      Sample policy for the devsecops-os reference architecture. Requires
      cosign keyless signatures issued to the organisation's GitHub Actions
      workflow identity and a SLSA provenance attestation.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            # Replace with the organisation's registry + image patterns
            - "registry.example.internal/payments/*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/<OWNER>/<REPO>/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/<OWNER>/<REPO>/.github/workflows/*"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
              conditions:
                - all:
                    - key: "{{ builder.id }}"
                      operator: AnyIn
                      value:
                        - "https://github.com/<OWNER>/<REPO>/.github/workflows/*"
