# Master workflow for devsecops-os (phase 1): runs all 10 gates against
# a sample workload variant. Gate 10 (AI PR Review Gate) is OFF BY DEFAULT —
# the whole workflow must be complete while it is off (blueprint section 5.3).
# The evidence-bundle job at the end is the M4 evidence collector (packs the
# bundle + SHA-256 manifest after every gate has finished, collects only,
# does not change any gate's blocking decision).
name: "All gates (payments-sample)"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      workload_path:
        description: "Workload variant to run all gates against"
        required: false
        type: choice
        options:
          - "examples/payments-sample/clean"
          - "examples/payments-sample/planted"
        default: "examples/payments-sample/clean"
      enable_ai_pr_review:
        description: "Enable gate 10 (only once flagship #1 is published)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate-01:
    uses: ./.github/workflows/gate-01-secret.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-02:
    uses: ./.github/workflows/gate-02-sast.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-03:
    uses: ./.github/workflows/gate-03-sca.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-04:
    uses: ./.github/workflows/gate-04-iac.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-05:
    uses: ./.github/workflows/gate-05-container.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-06:
    uses: ./.github/workflows/gate-06-sbom-attestation.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-07:
    uses: ./.github/workflows/gate-07-license.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-08:
    uses: ./.github/workflows/gate-08-kev-epss.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-09:
    uses: ./.github/workflows/gate-09-pipeline-hygiene.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
  gate-10:
    uses: ./.github/workflows/gate-10-ai-pr-review.yml
    with:
      workload_path: "${{ inputs.workload_path }}"
      enabled: "${{ inputs.enable_ai_pr_review }}"
  evidence-bundle:
    # M4 — evidence collector: gathers the output of every gate, checks each
    # record against the M2 schema, packs the evidence bundle with its
    # SHA-256 manifest and uploads it as an artefact. COLLECT ONLY — this job does not
    # change any gate's blocking decision: it runs `if: always()`
    # and `--allow-incomplete` per the "final gate" principle in
    # blueprint section 5.2 (missing evidence -> the bundle carries the
    # evidence-incomplete flag; phase 1 does not block the pipeline on evidence).
    # Gate 10 stays OFF BY DEFAULT like every other job in this workflow.
    needs: [gate-01, gate-02, gate-03, gate-04, gate-05, gate-06, gate-07, gate-08, gate-09, gate-10]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # M5-B: only for keyless (OIDC) signing of the evidence bundle in the final step of this job
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Download artefacts from all gates (no merging — keep the per-gate structure)"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: "gate-*"
          path: "gate-outputs"
      - name: "Build the run directory per the evidence/output/<run>/gate-NN-* contract"
        run: |
          mkdir -p evidence-run
          for d in gate-outputs/*/; do
            cp -r "${d}" "evidence-run/$(basename "${d}")"
          done
          find evidence-run -type f | sort
      - name: "Pack the evidence bundle (M4 collector)"
        run: |
          python3 evidence/bundle_tool.py collect evidence-run \
            --run-id "ci-${{ github.sha }}" \
            --out-dir "evidence-bundle" \
            --allow-incomplete
      - name: "Self-verify the bundle just packed (single command)"
        run: python3 evidence/verify_bundle.py evidence-bundle
      - name: "Download cosign (pinned sha256 — same version as gates/local/fetch_tools.sh)"
        run: |
          curl -sSfL -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          cosign version
      - name: "Keyless-sign (OIDC) the evidence bundle + verify in place"
        run: |
          cosign sign-blob --yes --bundle evidence-bundle/bundle.sigstore.json evidence-bundle/bundle.sha256
          cosign verify-blob --bundle evidence-bundle/bundle.sigstore.json \
            --certificate-identity-regexp "^https://github.com/techdevfun/devsecops-os/.github/workflows/all-gates.yml@refs/heads/main$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            evidence-bundle/bundle.sha256
      - name: "Upload the evidence bundle"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "evidence-bundle"
          path: "evidence-bundle"
          if-no-files-found: error
  # M5: the old collect-gate-outputs job (merging artefacts with merge-multiple,
  # which could let same-named files from different gates overwrite each other) was REMOVED
  # entirely — evidence-bundle above is the only evidence collection path.
