# Reusable workflow — Gate 02: SAST (Semgrep, report-only)
# Mã chạy thật nằm ở gates/local/gate-02.sh (dùng chung với kiểm
# chứng cục bộ); workflow này chỉ checkout, tải công cụ đã ghim và gọi
# script đó. Xem gates/README.md.
name: "Gate 02 — sast"

on:
  workflow_call:
    inputs:
      workload_path:
        description: "Thư mục workload cần quét (theo repo)"
        required: false
        type: string
        default: "examples/payments-sample/clean"

permissions:
  contents: read

jobs:
  gate-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Tải công cụ của bộ gates (ghim phiên bản + sha256)"
        run: bash gates/local/fetch_tools.sh
        env:
          TOOLS_DIR: "${{ runner.temp }}/devsecops-tools"
      - name: "Cài Semgrep (ghim phiên bản, venv riêng)"
        run: |
          python3 -m venv "${{ runner.temp }}/devsecops-tools/semgrep-venv"
          "${{ runner.temp }}/devsecops-tools/semgrep-venv/bin/pip" install "semgrep==1.182.1"
      - name: "Chạy gate 02"
        env:
          REPO_ROOT: "${{ github.workspace }}"
          WORKLOAD: "${{ github.workspace }}/${{ inputs.workload_path }}"
          OUT_ROOT: "${{ github.workspace }}/evidence/output/ci"
          COMMIT_SHA: "${{ github.sha }}"
          TOOLS_DIR: "${{ runner.temp }}/devsecops-tools"
        run: bash gates/local/gate-02.sh
      - name: "Tải lên bằng chứng của gate 02"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "gate-02-sast"
          path: "evidence/output/ci/gate-02-sast"
          if-no-files-found: warn
