# Reusable workflow — Gate 10: AI PR Review Gate (flagship #1).
# OFF BY DEFAULT in phase 1 (blueprint section 5.3): the enabled input defaults to
# false. Enable only once flagship #1 passes its own publish gate.
name: "Gate 10 — ai-pr-review"

on:
  workflow_call:
    inputs:
      workload_path:
        description: "Workload directory (unused when the gate is off)"
        required: false
        type: string
        default: "examples/payments-sample/clean"
      enabled:
        description: "Enable gate 10 (only once flagship #1 is published)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Gate 10 — declared state"
        env:
          REPO_ROOT: "${{ github.workspace }}"
          WORKLOAD: "${{ github.workspace }}/${{ inputs.workload_path }}"
          OUT_ROOT: "${{ github.workspace }}/evidence/output/ci"
          COMMIT_SHA: "${{ github.sha }}"
          ENABLE_AI_PR_REVIEW: "${{ inputs.enabled }}"
        run: bash gates/local/gate-10.sh
      - name: "Upload gate 10 record"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "gate-10-ai-pr-review"
          path: "evidence/output/ci/gate-10-ai-pr-review"
          if-no-files-found: warn
