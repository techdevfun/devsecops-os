# Reusable workflow — Gate 10: AI PR Review Gate (flagship #1).
# MẶC ĐỊNH TẮT ở pha 1 (blueprint mục 5.3): input enabled mặc định
# false. Chỉ bật khi flagship #1 qua cổng publish riêng của nó.
name: "Gate 10 — ai-pr-review"

on:
  workflow_call:
    inputs:
      workload_path:
        description: "Thư mục workload (không dùng khi gate tắt)"
        required: false
        type: string
        default: "examples/payments-sample/clean"
      enabled:
        description: "Bật gate 10 (chỉ khi flagship #1 đã publish)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate-10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Gate 10 — trạng thái khai báo"
        env:
          REPO_ROOT: "${{ github.workspace }}"
          WORKLOAD: "${{ github.workspace }}/${{ inputs.workload_path }}"
          OUT_ROOT: "${{ github.workspace }}/evidence/output/ci"
          COMMIT_SHA: "${{ github.sha }}"
          ENABLE_AI_PR_REVIEW: "${{ inputs.enabled }}"
        run: bash gates/local/gate-10.sh
      - name: "Tải lên ghi nhận của gate 10"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "gate-10-ai-pr-review"
          path: "evidence/output/ci/gate-10-ai-pr-review"
          if-no-files-found: warn
