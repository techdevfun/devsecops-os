# CI for a service born from the api-service golden path (M5).
#
# This template calls devsecops-os's 10 reusable workflow gates and
# collects evidence with the evidence-bundle job (M4). Phase 1
# assumption: the service repo is created from the devsecops-os tree (the
# organization's template repo contains the full gate set in
# .github/workflows/gate-*.yml and gates/local/) — when the repo is split
# out, point `uses:` at the organization's system repo; the content does
# not change.
#
# CHANGE EXACTLY ONE THING when creating a service: the workload_path
# value below (default "." = the service directory itself, if the service
# sits at the repo root).
name: "Service CI — devsecops-os gates"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      workload_path:
        description: "The service's directory in the repo"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  gate-01: {uses: ./.github/workflows/gate-01-secret.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-02: {uses: ./.github/workflows/gate-02-sast.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-03: {uses: ./.github/workflows/gate-03-sca.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-04: {uses: ./.github/workflows/gate-04-iac.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-05: {uses: ./.github/workflows/gate-05-container.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-06: {uses: ./.github/workflows/gate-06-sbom-attestation.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-07: {uses: ./.github/workflows/gate-07-license.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-08: {uses: ./.github/workflows/gate-08-kev-epss.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-09: {uses: ./.github/workflows/gate-09-pipeline-hygiene.yml}
  gate-10: {uses: ./.github/workflows/gate-10-ai-pr-review.yml}

  evidence-bundle:
    # Collect evidence following the exact pattern of the evidence-bundle
    # job in the system repo's .github/workflows/all-gates.yml (M4):
    # download artefacts WITHOUT merging (to avoid overwriting records
    # with duplicate names), build the run directory, package the bundle
    # with a SHA-256 manifest, and self-verify.
    needs: [gate-01, gate-02, gate-03, gate-04, gate-05, gate-06, gate-07,
            gate-08, gate-09, gate-10]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Download every gate's artefacts (no merging — keep the per-gate structure)"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: "gate-*"
          path: "gate-outputs"
      - name: "Build the run directory + package the bundle + verify"
        run: |
          mkdir -p evidence-run
          for d in gate-outputs/*/; do
            cp -r "${d}" "evidence-run/$(basename "${d}")"
          done
          python3 evidence/bundle_tool.py collect evidence-run \
            --run-id "ci-${{ github.sha }}" \
            --out-dir "evidence-bundle" \
            --allow-incomplete
          python3 evidence/verify_bundle.py evidence-bundle
      - name: "Upload the evidence bundle"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "evidence-bundle"
          path: "evidence-bundle"
          if-no-files-found: error
