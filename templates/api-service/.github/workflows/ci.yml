# CI của service sinh ra từ golden path api-service (M5).
#
# Mẫu này gọi 10 reusable workflow gates của devsecops-os và gom bằng
# chứng bằng job evidence-bundle (M4). Giả định pha 1: repo service được
# tạo từ cây của devsecops-os (template repo của tổ chức chứa cả bộ gates
# ở .github/workflows/gate-*.yml và gates/local/) — khi tách repo riêng,
# trỏ `uses:` sang repo hệ thống của tổ chức, nội dung không đổi.
#
# ĐỔI MỘT CHỖ DUY NHẤT khi tạo service: giá trị workload_path ở dưới
# (mặc định "." = chính thư mục service nếu service nằm ở gốc repo).
name: "Service CI — devsecops-os gates"

on:
  pull_request:
  workflow_dispatch:
    inputs:
      workload_path:
        description: "Thư mục của service trong repo"
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  gate-01: {uses: ./.github/workflows/gate-01-secret.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-02: {uses: ./.github/workflows/gate-02-sast.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-03: {uses: ./.github/workflows/gate-03-sca.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-04: {uses: ./.github/workflows/gate-04-iac.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-05: {uses: ./.github/workflows/gate-05-container.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-06: {uses: ./.github/workflows/gate-06-sbom-attestation.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-07: {uses: ./.github/workflows/gate-07-license.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-08: {uses: ./.github/workflows/gate-08-kev-epss.yml, with: {workload_path: "${{ inputs.workload_path || '.' }}"}}
  gate-09: {uses: ./.github/workflows/gate-09-pipeline-hygiene.yml}
  gate-10: {uses: ./.github/workflows/gate-10-ai-pr-review.yml}

  evidence-bundle:
    # Gom bằng chứng theo đúng mẫu của job evidence-bundle trong
    # .github/workflows/all-gates.yml của repo hệ thống (M4): tải
    # artefact KHÔNG gộp (tránh ghi đè record trùng tên), dựng thư mục
    # lần chạy, đóng bundle kèm manifest SHA-256, tự kiểm chứng.
    needs: [gate-01, gate-02, gate-03, gate-04, gate-05, gate-06, gate-07,
            gate-08, gate-09, gate-10]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: "Tải artefact của mọi gate (không gộp — giữ cấu trúc theo gate)"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: "gate-*"
          path: "gate-outputs"
      - name: "Dựng thư mục lần chạy + đóng bundle + kiểm chứng"
        run: |
          mkdir -p evidence-run
          for d in gate-outputs/*/; do
            cp -r "${d}" "evidence-run/$(basename "${d}")"
          done
          python3 evidence/bundle_tool.py collect evidence-run \
            --run-id "ci-${{ github.sha }}" \
            --out-dir "evidence-bundle" \
            --allow-incomplete
          python3 evidence/verify_bundle.py evidence-bundle
      - name: "Tải lên evidence bundle"
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: "evidence-bundle"
          path: "evidence-bundle"
          if-no-files-found: error
