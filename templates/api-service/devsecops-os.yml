# devsecops-os configuration for this service — generated from the golden path
# templates/api-service (M5). Safe phase 1 defaults: gate 1 + gate 9
# block immediately; the remaining gates are report-only until calibration is complete
# on this service's own history (backtest -> report-only -> enforce).

version: 1

organization:
  name: example-bank            # organization name (only recorded in evidence reports)
  config_repo: null             # central config repo (phase 3), leave empty in phase 1

# Policy packs to be installed at M2. The mapping is a REFERENCE, not a compliance certification.
policy_packs:
  - iso-27001-2022
  - nist-csf-ssdf
  - pci-dss-4
  # - apra-cps-234
  # - apra-cps-230
  # - soc-2

gates:
  secret-scanning:
    mode: block                 # the only gate blocking by default right away (low noise)
  sast:
    mode: report-only
  sca:
    mode: report-only
  iac:
    mode: report-only
  container:
    mode: report-only
  sbom-attestation:
    mode: report-only           # missing SBOM/attestation: warning in phase 1
  license:
    mode: report-only
  kev-epss:
    mode: report-only
    kev_block: true             # CVE in CISA KEV: first blocking candidate once calibration is complete
    epss_threshold: 0.5
  pipeline-hygiene:
    mode: block                 # third-party action not pinned to a full SHA -> block
  ai-pr-review:                 # flagship #1 — OFF BY DEFAULT in phase 1
    enabled: false              # only enable when flagship #1 passes its own separate publish gate
    mode: report-only

evidence:
  store: "./.devsecops-os/evidence"   # inside the organization's infrastructure; may point to S3/object storage
  retention_days: 400
  bundle_manifest: sha256

notifications:
  # Use GitHub's built-in mechanisms (check run, PR comment). A webhook is the
  # organization's optional choice, with credentials managed by the organization via its own secrets.
  webhook_url_secret: null      # name of the secret containing the Slack/Teams/Telegram webhook, leave empty = off
