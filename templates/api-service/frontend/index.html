<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>example-service — devsecops-os golden-path template</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>example-service</h1>
    <p class="note">
      Golden-path API skeleton for devsecops-os. Replace the sample
      <em>items</em> resource with your real domain — the security
      defaults around it are the point of the template.
    </p>

    <section>
      <h2>Create an item</h2>
      <form id="item-form">
        <label>Name
          <input id="name" type="text" value="example-item-2" required>
        </label>
        <button type="submit">Submit</button>
      </form>
      <p id="form-result" role="status"></p>
    </section>

    <section>
      <h2>Items</h2>
      <button id="refresh" type="button">Refresh</button>
      <ul id="item-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
