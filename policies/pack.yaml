# Policy pack v1 — metadata, versioning and review schedule.
# Blueprint rule R4: each framework records the source text it was
# checked against + the check date; if a framework has not been reviewed
# for over 12 months, the pack is flagged "stale".
pack:
  name: devsecops-os-policy-pack
  version: 1.1.0
  built_at: "2026-10-23"
  status: published (public — github.com/techdevfun/devsecops-os, phase 1 prerelease v1.0.0-phase1)
  mapping_notice: >-
    All mappings below are REFERENCE MAPPINGS at control-group level,
    for design and audit preparation. They are not a certification of
    compliance under any framework.

frameworks:
  - id: iso-27001-2022
    name: "ISO/IEC 27001:2022 (Annex A)"
    source: "Annex A control groups following the 4-theme structure of the 2022 edition; clause-level detail is checked against the original text when an organisation adopts it"
    reviewed_at: "2026-10-22"
  - id: nist-csf-ssdf
    name: "NIST CSF 2.0 + SSDF (SP 800-218 v1.1)"
    source: "CSF 2.0 Functions/Categories; SSDF practices PW/PS/RV"
    reviewed_at: "2026-10-22"
  - id: pci-dss-4
    name: "PCI DSS v4.0"
    source: "The 12 main requirements of PCI DSS 4.0 (PCI SSC)"
    reviewed_at: "2026-10-22"
  - id: apra-cps-234
    name: "APRA CPS 234 (Information Security)"
    source: "APRA CPS 234 principles; clause-level detail is checked against the current APRA text during the deep build (blueprint section 8)"
    reviewed_at: "2026-10-22"
  - id: apra-cps-230
    name: "APRA CPS 230 (Operational Risk Management)"
    source: "The CPS 230 row in the blueprint belongs to PHASE 2 — pack v1 has no policy for CPS 230 yet"
    reviewed_at: "2026-10-22"
  - id: soc-2
    name: "SOC 2 (AICPA Trust Services Criteria, CC series)"
    source: "CC6/CC7/CC8 of TSC 2017 (revised)"
    reviewed_at: "2026-10-22"

engines:
  opa: ">= 1.0 (Rego v1) — verified locally with OPA 1.21.3"
  kyverno: ">= 1.10 — verified locally with Kyverno CLI 1.19.2 (apply/parse level; verifyImages needs a cluster)"
