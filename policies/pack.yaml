# Policy pack v1 — metadata, phiên bản và lịch rà soát.
# Quy tắc R4 của blueprint: mỗi khung ghi nguồn văn bản đã đối chiếu +
# ngày đối chiếu; quá 12 tháng chưa rà soát thì pack bị đánh dấu "stale".
pack:
  name: devsecops-os-policy-pack
  version: 1.0.0
  built_at: "2026-10-22"
  status: local-only (M2 — chưa publish, chưa có repo GitHub)
  mapping_notice: >-
    Mọi ánh xạ dưới đây là ÁNH XẠ THAM CHIẾU ở mức nhóm kiểm soát, phục
    vụ thiết kế và chuẩn bị kiểm toán. Không phải chứng nhận tuân thủ
    dưới bất kỳ khung nào.

frameworks:
  - id: iso-27001-2022
    name: "ISO/IEC 27001:2022 (Annex A)"
    source: "Nhóm kiểm soát Annex A theo cấu trúc 4 chủ đề của bản 2022; chi tiết điều khoản đối chiếu văn bản gốc khi tổ chức áp dụng"
    reviewed_at: "2026-10-22"
  - id: nist-csf-ssdf
    name: "NIST CSF 2.0 + SSDF (SP 800-218 v1.1)"
    source: "CSF 2.0 Functions/Categories; SSDF practices PW/PS/RV"
    reviewed_at: "2026-10-22"
  - id: pci-dss-4
    name: "PCI DSS v4.0"
    source: "12 yêu cầu chính của PCI DSS 4.0 (PCI SSC)"
    reviewed_at: "2026-10-22"
  - id: apra-cps-234
    name: "APRA CPS 234 (Information Security)"
    source: "Nguyên tắc CPS 234 của APRA; chi tiết điều khoản đối chiếu văn bản APRA hiện hành khi build sâu (blueprint mục 8)"
    reviewed_at: "2026-10-22"
  - id: apra-cps-230
    name: "APRA CPS 230 (Operational Risk Management)"
    source: "Hàng CPS 230 trong blueprint thuộc PHA 2 — pack v1 chưa có policy cho CPS 230"
    reviewed_at: "2026-10-22"
  - id: soc-2
    name: "SOC 2 (AICPA Trust Services Criteria, CC series)"
    source: "CC6/CC7/CC8 của TSC 2017 (revised)"
    reviewed_at: "2026-10-22"

engines:
  opa: ">= 1.0 (Rego v1) — kiểm chứng cục bộ bằng OPA 1.21.3"
  kyverno: ">= 1.10 — kiểm chứng cục bộ bằng Kyverno CLI 1.19.2 (mức apply/parse; verifyImages cần cluster)"
