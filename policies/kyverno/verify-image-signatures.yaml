# verify-image-signatures — Kyverno ClusterPolicy (verifyImages):
# only accepts images signed keyless with the OIDC identity of a
# workflow belonging to the organisation AND with a matching SLSA
# provenance attestation. This is the destination-side enforcement
# point of the provenance policy (policies/rego/provenance.rego
# produces the CI-side decision; Kyverno blocks at admission).
#
# This pack formalises the M1 sample in docs/examples/kyverno-verify-images.yaml.
# Before use you MUST replace: <OWNER>/<REPO>, the registry and the
# image name pattern.
# VERIFICATION NOTE: verifyImages rules need a cluster + Rekor/Cosign
# to run for real; in M2 only parsing + structure are verified (see
# the M2 report).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: devsecops-os-verify-image-signatures
  annotations:
    policies.kyverno.io/title: "devsecops-os: verify signed images with provenance"
    policies.kyverno.io/category: "Supply Chain Security"
    policies.kyverno.io/description: >-
      Requires cosign keyless signatures issued to the organisation's
      GitHub Actions workflow identity and a SLSA provenance attestation.
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-signature-and-provenance
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - "registry.example.internal/payments/*"
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/<OWNER>/<REPO>/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - predicateType: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        subject: "https://github.com/<OWNER>/<REPO>/.github/workflows/*"
                        issuer: "https://token.actions.githubusercontent.com"
                        rekor:
                          url: https://rekor.sigstore.dev
