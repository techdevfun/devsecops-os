# workload-baseline — Kyverno ClusterPolicy: minimum safety
# baseline for workloads on Kubernetes (cloud + on-prem):
#   1. Pods and containers must run non-root (runAsNonRoot=true; user 0 is forbidden).
#   2. Containers must have resource requests/limits (CPU + memory).
#   3. allowPrivilegeEscalation=true is forbidden; dropping capability ALL is required.
# Reference mapping: ISO 27001 A.8.9 (configuration management),
# SOC 2 CC6.6 (system boundaries), PCI DSS Req 2 (do not use vendor
# default configurations).
# The sample manifest of payments-sample (clean variant) PASSES all
# three rules — see harness/kyverno-check for local verification.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: devsecops-os-workload-baseline
  annotations:
    policies.kyverno.io/title: "devsecops-os: workload baseline"
    policies.kyverno.io/category: "Pod Security"
    policies.kyverno.io/description: >-
      Minimum runtime baseline for workloads: non-root, resource limits,
      no privilege escalation, drop ALL capabilities.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-run-as-nonroot
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pods must run non-root: set securityContext.runAsNonRoot=true on the pod and/or containers; runAsUser=0 is forbidden."
        # Pattern follows Kyverno's sample "require-run-as-nonroot" policy:
        # anchor =(...) = "if declared, it must equal this value".
        anyPattern:
          - spec:
              securityContext:
                runAsNonRoot: true
              containers:
                - (name): "*"
                  =(securityContext):
                    =(runAsNonRoot): true
                    =(runAsUser): ">0"
          - spec:
              containers:
                - (name): "*"
                  securityContext:
                    runAsNonRoot: true
                    =(runAsUser): ">0"
    - name: require-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Every container must set resources.requests and limits (cpu + memory)."
        pattern:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    memory: "?*"
                    cpu: "?*"
                  limits:
                    memory: "?*"
                    cpu: "?*"
    - name: restrict-privilege-and-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Containers must not set allowPrivilegeEscalation=true and must drop capability ALL."
        pattern:
          spec:
            containers:
              - (name): "*"
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                      - ALL
